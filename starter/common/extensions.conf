[general]
static=yes
writeprotect=yes

[globals]
CALLER_HZ=440
CALLEE_HZ=660
; Two seconds before the media check, then this many more seconds of tone.
AFTER_CHECK_SECONDS=10

[from-peer]
exten => 200,1,Answer()
 same => n,Set(LAB_TAG=inbound)
 same => n,Set(TONE_HZ=${CALLEE_HZ})
 same => n,Goto(tones,s,1)

[caller-tone]
; The originate command uses a numeric extension as its local run identifier.
exten => _X.,1,Set(LAB_TAG=${EXTEN})
 same => n,Set(TONE_HZ=${CALLER_HZ})
 same => n,Goto(tones,s,1)

[tones]
exten => s,1,Set(LAB_ID=${CHANNEL(pjsip,call-id)})
 same => n,PlayTones(${TONE_HZ})
 same => n,Wait(2)
 ; These are live properties of the answered PJSIP channel. No SDP is logged.
 same => n,Log(NOTICE,LAB-MEDIA tag=${LAB_TAG} id=${LAB_ID} channel=${CHANNEL} tls=${CHANNEL(pjsip,secure)} srtp=${CHANNEL(rtp,secure,audio)} codec=${CHANNEL(audionativeformat)} remote=${CHANNEL(rtp,dest,audio)} tx=${CHANNEL(rtcp,txcount,audio)} rx=${CHANNEL(rtcp,rxcount,audio)})
 same => n,Wait(${AFTER_CHECK_SECONDS})
 same => n,Hangup()
exten => h,1,Log(NOTICE,LAB-END tag=${LAB_TAG} id=${LAB_ID})
