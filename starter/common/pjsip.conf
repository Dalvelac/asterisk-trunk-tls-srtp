[global]
type=global
endpoint_identifier_order=ip

; The selected profile supplies the transport, static peer URI and media policy.
#include link.conf

[peer](media-policy)
type=endpoint
transport=link
aors=peer
context=from-peer
identify_by=ip
disallow=all
allow=ulaw:20
use_ptime=yes
direct_media=no
media_address=@LOCAL_IP@
bind_rtp_to_media_address=yes
ice_support=no
dtmf_mode=none
allow_subscribe=no
media_encryption_optimistic=no
media_use_received_transport=no

[only-peer]
type=identify
endpoint=peer
match=@PEER_IP@/32
