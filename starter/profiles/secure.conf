[link]
type=transport
protocol=tls
bind=@LOCAL_IP@:5061
method=tlsv1_2
ca_list_file=/run/asterisk/tls/ca.crt
cert_file=/run/asterisk/tls/node.crt
priv_key_file=/run/asterisk/tls/node.key
verify_server=yes
verify_client=yes
require_client_cert=yes
allow_wildcard_certs=no

[peer]
type=aor
contact=sip:@PEER_NAME@:5061\;transport=tls
qualify_frequency=0

[media-policy](!)
media_encryption=sdes
srtp_tag_32=no
